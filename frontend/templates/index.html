<!DOCTYPE html>
<html>

<head>

<title>SIEM-Lite Dashboard</title>

<meta http-equiv="refresh" content="5">

<style>

body{
    background:#111827;
    color:white;
    font-family:Arial;
    margin:30px;
}

h1{
    margin-bottom:25px;
}

.cards{

    display:flex;
    gap:20px;
    margin-bottom:30px;

}

.card{

    background:#1f2937;
    padding:20px;
    border-radius:12px;
    width:220px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.4);

}

.card h2{

    margin:0;

}

.card p{

    font-size:28px;
    margin-top:10px;

}

table{

    width:100%;
    border-collapse:collapse;
    background:#1f2937;

}

th{

    background:#2563eb;
    padding:12px;

}

td{

    padding:12px;
    border-bottom:1px solid #333;

}

tr:hover{

    background:#374151;

}

.high{

    color:red;
    font-weight:bold;

}

.medium{

    color:orange;
    font-weight:bold;

}

.low{

    color:lime;
    font-weight:bold;

}

</style>

</head>

<body>

<h1>🚨 SIEM-Lite SOC Dashboard</h1>

<div class="cards">

<div class="card">

<h2>Total Alerts</h2>

<p>{{ total }}</p>

</div>

</div>

<table>

<tr>

<th>Timestamp</th>
<th>Type</th>
<th>User</th>
<th>Severity</th>

</tr>

{% for alert in alerts %}

<tr>

<td>{{ alert.timestamp }}</td>

<td>{{ alert.type }}</td>

<td>{{ alert.user }}</td>

<td class="{{ alert.severity.lower() }}">

{{ alert.severity }}

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
